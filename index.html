<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-Absensi SMA AT-TIJAARAH/title>
    <meta name="description"
      content="Aplikasi scanner kehadiran cepat khusus penjaga sekolah terintegrasi Google Sheets E-Absensi">

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet">

    <!-- QR Scanner Library (CDN) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- Firebase App & Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="./style.css?v=3.0">
</head>

<body>

  <!-- ================= 1. HALAMAN LOGIN PENJAGA SEKOLAH ================= -->
  <div id="loginScreen" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <div class="login-badge-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <h1 class="login-title">Pos Presensi Siswa</h1>
        <p class="login-subtitle">Masuk sebagai Petugas Piket</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="loginUsername">Nama Pengguna / ID</label>
          <input type="text" id="loginUsername" placeholder="Masukkan Username" required autofocus
            autocomplete="username">
        </div>

        <div class="form-group">
          <label for="loginPin">Masukkan Password</label>
          <input type="password" id="loginPin" placeholder="Masukkan PIN / Kata Sandi" required maxlength="20"
            autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login" id="btnLoginSubmit">
          <span>Buka Aplikasi Scanner</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="login-footer">
        <span class="version-tag">E-Absensi SMA AT-TIJAARAH</span>
      </div>
    </div>
  </div>

  <!-- ================= 2. APLIKASI UTAMA (FOKUS & MINIMALIS) ================= -->
  <div id="mainApp" class="main-wrapper hidden">
    <!-- Header Ringkas -->
    <header class="app-header-simple">
      <div class="header-left">
        <div class="guard-pill">
          <span class="guard-dot"></span>
          <span id="activeGuardName">Petugas: Penjaga Sekolah</span>
        </div>
        <div class="date-badge" id="liveDate">Senin, 01 Januari 2026</div>
      </div>

      <div class="header-center" id="headerCenterWrap">
        <span class="mobile-date-text" id="liveDateMobile">Senin, 01 Januari 2026</span>
        <span id="liveTime" class="header-clock">00:00:00</span>
      </div>

      <div class="header-right">
        <!-- Status Indikator Sederhana -->
        <span id="headerSyncStatus" class="status-indicator synced" title="Status Sinkronisasi ke Spreadsheet">
          ☁️ <span class="sync-label">Sheets: Siap</span> (<span id="pendingSyncCount">0</span>)
        </span>
        <button id="btnSoundToggle" class="btn-header-action" title="Toggle Suara Beep">
          <span id="soundStatusEmoji">🔊</span>
        </button>
        <button id="btnOpenSettings" class="btn-header-action hidden" title="Pengaturan Sistem (Khusus Admin)">
          ⚙️
        </button>
        <button id="btnLogout" class="btn-header-action btn-logout-action" title="Keluar / Ganti Petugas">
          🚪 <span class="btn-logout-label">Keluar</span>
        </button>
      </div>
    </header>

    <!-- Konten Utama: 2 Kolom Bersih (Kiri: Scanner, Kanan: Daftar Nama Hadir) -->
    <main class="simple-layout">

      <!-- KOLOM KIRI: SCANNER & INPUT MANUAL TANPA KARTU -->
      <section class="scanner-section">

        <!-- PUSAT KONTROL UTAMA: PILIHAN MASUK / KELUAR & CATAT SISWA TANPA KARTU (SIMETRIS DI TENGAH) -->
        <div class="scanner-top-center-bar">

          <!-- SEGMENTED TOGGLE: CUKUP TULISAN MASUK & KELUAR (SIMETRIS DI TENGAH) -->
          <div class="mode-toggle-wrapper">
            <div class="mode-segmented-pill">
              <button type="button" id="btnModeMasuk" class="mode-pill-btn active mode-masuk"
                title="Klik untuk Presensi Masuk">
                <span class="pill-icon">🌅</span>
                <span class="pill-label">Masuk</span>
              </button>
              <button type="button" id="btnModePulang" class="mode-pill-btn mode-keluar"
                title="Klik untuk Presensi Keluar">
                <span class="pill-icon">🌇</span>
                <span class="pill-label">Keluar</span>
              </button>
            </div>
          </div>

          <!-- TOMBOL CEPAT: SISWA TANPA KARTU (SIMETRIS DI TENGAH) -->
          <div class="without-card-wrapper">
            <button type="button" id="btnOpenManualWithoutCard" class="btn-without-card-centered"
              title="Catat manual siswa yang lupa/tidak membawa kartu ID">
              <span class="btn-icon-pulse">⚠️</span>
              <span class="btn-title">Catat Siswa Tanpa Kartu</span>
            </button>
          </div>

        </div>

        <!-- Action Utama Petugas: Scanner + Tab Scanner -->
        <div class="scanner-main-box">

          <div class="scanner-header-row">
            <div class="scanner-mode-switch">
              <button id="tabUsb" class="btn-tab active">🔌 Scanner Kabel (USB)</button>
              <button id="tabCamera" class="btn-tab">📷 Kamera HP/Webcam</button>
            </div>

            <div class="scanner-status-indicator" id="scannerModeIndicator">
              <span class="status-dot-pulse"></span>
              <span id="scannerModeIndicatorText">Mode: Masuk</span>
            </div>
          </div>

          <!-- Viewport Scanner USB -->
          <div id="usbScannerView" class="scanner-display-area">
            <div class="scanner-radar"></div>
            <div class="scanner-laser"></div>

            <div class="scanner-content">
              <div class="scanner-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 7V4h3M17 4h3v3M4 17v3h3M20 17v3h-3" />
                  <line x1="3" y1="12" x2="21" y2="12" stroke="#ef4444" stroke-width="2.5" />
                  <rect x="7" y="7" width="10" height="10" rx="1" />
                </svg>
              </div>
              <h2 class="scanner-instruction">Silakan Scan Kartu QR Siswa</h2>
              <p class="scanner-subtext">Arahkan barcode kartu ke scanner. Otomatis membaca langsung tanpa klik!</p>

              <div class="quick-manual-input">
                <input type="text" id="manualNisnInput" placeholder="Atau ketik NISN di sini lalu tekan Enter..."
                  autocomplete="off">
              </div>
            </div>
          </div>

          <!-- Viewport Kamera (Jika mode kamera diaktifkan) -->
          <div id="cameraScannerView" class="scanner-display-area camera-area hidden">
            <div id="qrReader" style="width: 100%; max-width: 450px;"></div>
            <div class="camera-actions">
              <button id="btnSwitchCamera" class="btn-secondary-sm">🔄 Ganti Kamera</button>
              <button id="btnStopCamera" class="btn-secondary-sm">Tutup Kamera</button>
            </div>
          </div>

          <!-- Info Aturan Waktu Ringkas -->
          <div class="rules-footer" id="rulesFooterText">
            <span id="rfItem1">Buka Masuk: <strong id="displayBatasJamMulai">06:00</strong></span>
            <span>•</span>
            <span id="rfItem2">Toleransi: <strong id="displayToleransi">06:40</strong></span>
            <span>•</span>
            <span id="rfItem3">Tutup: <strong id="displayBatasJamSelesai">08:00</strong></span>
            <span>•</span>
            <span id="rfItem4">Terlambat: <strong id="displayPoin">1</strong> Poin</span>
          </div>
        </div>

        <!-- Banner Hasil Terakhir Scan (Besar & Terang Seketika) -->
        <div id="scanResultCard" class="result-card-banner hidden">
          <div class="result-status-icon" id="resultIcon">✅</div>
          <div class="result-details">
            <div class="result-badge-row">
              <span class="badge-tag" id="resultStatusTag">TEPAT WAKTU</span>
              <span class="badge-tag badge-class" id="resultClassTag">Kelas: -</span>
              <span class="badge-tag badge-warning hidden" id="resultCardStatusTag">TANPA KARTU</span>
              <span class="result-time-txt" id="resultTimeText">06:55:12</span>
            </div>
            <h3 class="result-student-name" id="resultStudentName">Ahmad Fauzi</h3>
            <p class="result-sub-info" id="resultSubInfo">Kelas: <strong id="resultStudentClass"
                style="color: var(--cyan);">-</strong> • NISN: <span id="resultStudentNisn">-</span></p>
            <p class="result-points-alert" id="resultPointsAlert"></p>
          </div>
          <div class="speed-pill" id="resultSpeed">12ms</div>
        </div>

      </section>

      <!-- KOLOM KANAN: HANYA DAFTAR NAMA YANG HADIR -->
      <aside class="attendance-section">
        <div class="attendance-section-header">
          <div class="title-with-counter">
            <h2 class="attendance-title">Siswa Hadir Hari Ini</h2>
            <span class="count-bubble" id="countTotal">0</span>
          </div>

          <!-- Ringkasan Singkat: Hadir, Terlambat, Pulang, Tanpa Kartu -->
          <div class="mini-summary">
            <span class="summary-badge ontime" title="Hadir Tepat Waktu">
              ✅ <span id="countOnTime">0</span>
            </span>
            <span class="summary-badge late" title="Terlambat">
              ⏰ <span id="countLate">0</span>
            </span>
            <span class="summary-badge pulang" title="Siswa Pulang"
              style="background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3);">
              🏠 <span id="countPulang">0</span>
            </span>
            <span class="summary-badge without-card" title="Tidak Bawa Kartu">
              ⚠️ <span id="countWithoutCard">0</span>
            </span>
          </div>
        </div>

        <!-- Pencarian Cepat Nama di Riwayat -->
        <div class="history-search-bar">
          <input type="text" id="searchHistoryInput" placeholder="Cari nama siswa yang sudah hadir...">
        </div>

        <!-- List Nama yang Hadir -->
        <div class="attendance-scroll-list">
          <ul id="attendanceList" class="clean-attendance-list">
            <li class="empty-notice">
              <span class="empty-emoji">📋</span>
              <p>Belum ada siswa yang hadir hari ini.</p>
              <small>Scan kartu siswa atau input manual untuk memulai.</small>
            </li>
          </ul>
        </div>
      </aside>

    </main>
  </div>

  <!-- ================= 3. MODAL CATAT SISWA TANPA KARTU ================= -->
  <div id="manualWithoutCardModal" class="modal-backdrop hidden">
    <div class="modal-box modal-without-card-box">
      <div class="modal-box-header">
        <div class="modal-heading-wrap">
          <span class="warning-icon">⚠️</span>
          <div>
            <h3>Catat Siswa Tidak Membawa Kartu</h3>
            <p>Pencatatan kehadiran manual + otomatis dikenakan poin pelanggaran</p>
          </div>
        </div>
        <button id="btnCloseWithoutCardModal" class="btn-close-modal">&times;</button>
      </div>

      <form id="formWithoutCard" class="modal-box-body">
        <div class="form-group">
          <label for="inputSearchStudent">Cari Nama Siswa atau NISN:</label>
          <input type="text" id="inputSearchStudent" placeholder="Ketik nama atau NISN siswa..." autocomplete="off"
            required>
          <!-- Live Autocomplete dropdown -->
          <div id="studentSuggestions" class="suggestions-list hidden"></div>
        </div>

        <div class="student-preview-card" id="studentPreviewCard">
          <div class="preview-avatar">👤</div>
          <div>
            <h4 id="previewStudentName" class="preview-name">Pilih siswa dari pencarian di atas</h4>
            <p id="previewStudentDetails" class="preview-meta">NISN: - • Kelas: -</p>
          </div>
        </div>

        <input type="hidden" id="selectedNisn" value="">
        <input type="hidden" id="selectedName" value="">
        <input type="hidden" id="selectedClass" value="">

        <div class="form-group" style="margin-top: 10px;">
          <label for="selectViolationCategory" style="font-weight: 600; font-size: 0.85rem;">Kategori Pelanggaran
            E-Absensi:</label>
          <select id="selectViolationCategory"
            style="width: 100%; padding: 9px 12px; background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px;">
            <option value="Tidak membawa ID Card">Tidak membawa ID Card</option>
            <option value="Terlambat hadir di kelas lebih dari 10 menit.">Terlambat hadir di kelas lebih dari 10 menit.
            </option>
            <option value="Terlambat hadir di kelas lebih dari 10 menit. Tidak membawa ID Card">Terlambat hadir di kelas
              lebih dari 10 menit. Tidak membawa ID Card</option>
          </select>
        </div>

        <!-- Detail Poin Pelanggaran -->
        <div class="violation-summary-box">
          <div class="violation-row">
            <span>Pelanggaran: <strong>Tidak membawa ID Card</strong></span>
            <span class="point-tag warning" id="previewPoinTanpaKartu">+5 Poin</span>
          </div>
          <div class="violation-row" id="rowLateViolation">
            <span>Status Waktu Saat Ini: <strong id="previewTimeStatus">Tepat Waktu</strong></span>
            <span class="point-tag ontime" id="previewPoinLate">0 Poin</span>
          </div>
          <div class="violation-total">
            <span>Total Poin Pelanggaran:</span>
            <strong id="previewTotalPoints" class="total-points-highlight">5 Poin</strong>
          </div>
        </div>

        <div class="form-actions-row">
          <button type="button" id="btnCancelWithoutCard" class="btn-cancel">Batal</button>
          <button type="submit" id="btnSubmitWithoutCard" class="btn-confirm-save">
            💾 Simpan Kehadiran (Tanpa Kartu)
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= 4. MODAL PENGATURAN SISTEM ================= -->
  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-box-header">
        <div class="modal-heading-wrap">
          <span class="settings-icon">⚙️</span>
          <div>
            <h3>Pengaturan Sistem Scanner</h3>
            <p>Atur jam kehadiran, poin pelanggaran, PIN penjaga, dan integrasi spreadsheet</p>
          </div>
        </div>
        <button id="btnCloseSettings" class="btn-close-modal">&times;</button>
      </div>

      <div class="modal-box-body">
        <div class="settings-tabs-row">
          <button class="setting-tab-btn active" data-tab="stRules">Jadwal & Aturan Poin</button>
          <button class="setting-tab-btn" data-tab="stSecurity">Akun User & Admin</button>
          <button class="setting-tab-btn" data-tab="stSheets">Google Sheets & GAS</button>
          <button class="setting-tab-btn" data-tab="stFirebase">Firebase Cloud</button>
          <button class="setting-tab-btn" data-tab="stMaster">Data Master Siswa</button>
        </div>

        <!-- Tab 1: Jadwal & Poin -->
        <div id="stRules" class="tab-pane active">
          <div
            style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
            <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">Sesuaikan kategori poin pelanggaran
              dengan data sheet <code>konfigurasi_poin</code> E-Absensi:</p>
            <button id="btnFetchPointCategories" type="button" class="btn-secondary-action"
              style="padding: 8px 14px; font-weight: 700; color: var(--cyan); border-color: var(--cyan);">
              🔄 Muat Kategori dari Sheet 'konfigurasi_poin'
            </button>
          </div>

          <div class="form-grid-2">
            <div class="form-group" style="grid-column: 1 / -1;">
              <label for="cfgKategoriTerlambat">📌 Kategori Poin untuk Siswa Terlambat:</label>
              <select id="cfgKategoriTerlambat"
                style="width: 100%; padding: 10px; background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px;">
                <option value="Terlambat hadir di kelas lebih dari 10 menit.">Terlambat hadir di kelas lebih dari 10
                  menit.</option>
              </select>
              <small>Kategori ini otomatis digunakan saat siswa scan melewati batas jam toleransi.</small>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
              <label for="cfgKategoriTanpaKartu">📌 Kategori Poin untuk Siswa Tanpa ID Card:</label>
              <select id="cfgKategoriTanpaKartu"
                style="width: 100%; padding: 10px; background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px;">
                <option value="Tidak membawa ID Card">Tidak membawa ID Card</option>
              </select>
              <small>Kategori ini otomatis digunakan saat pencatatan manual siswa tidak membawa kartu.</small>
            </div>

            <!-- Bagian Presensi Masuk -->
            <div
              style="grid-column: 1 / -1; margin-top: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 1.1rem;">🌅</span>
              <strong style="color: #38bdf8;">Jadwal Presensi Masuk Sekolah</strong>
            </div>

            <div class="form-group">
              <label for="cfgJamMasukMulai">Jam Buka Presensi Masuk (WIB)</label>
              <input type="time" id="cfgJamMasukMulai" value="06:00">
              <small>Sebelum jam ini, scan masuk belum dibuka</small>
            </div>
            <div class="form-group">
              <label for="cfgJamToleransi">Batas Tepat Waktu (WIB)</label>
              <input type="time" id="cfgJamToleransi" value="06:40">
              <small>Lewat jam ini dihitung Terlambat</small>
            </div>
            <div class="form-group">
              <label for="cfgJamMasukSelesai">Jam Tutup Presensi Masuk (WIB)</label>
              <input type="time" id="cfgJamMasukSelesai" value="08:00">
              <small>Setelah jam ini, presensi masuk ditutup</small>
            </div>
            <div class="form-group">
              <label for="cfgPoinPelanggaran">Poin Siswa Terlambat</label>
              <input type="number" id="cfgPoinPelanggaran" value="1" min="0">
              <small>Dikenakan jika scan 06:41 s.d. 08:00</small>
            </div>

            <!-- Bagian Presensi Pulang -->
            <div
              style="grid-column: 1 / -1; margin-top: 15px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 1.1rem;">🌇</span>
              <strong style="color: #818cf8;">Jadwal Presensi Pulang Sekolah (Bebas Poin)</strong>
            </div>

            <div class="form-group">
              <label for="cfgJamPulangMulai">Jam Buka Presensi Pulang (WIB)</label>
              <input type="time" id="cfgJamPulangMulai" value="15:00">
              <small>Presensi pulang dibuka mulai jam ini (0 Poin)</small>
            </div>
            <div class="form-group">
              <label for="cfgJamPulangSelesai">Jam Tutup Presensi Pulang (WIB)</label>
              <input type="time" id="cfgJamPulangSelesai" value="18:00">
              <small>Batas akhir scan pulang sekolah</small>
            </div>

            <!-- Aturan Tambahan & Batasan Scan -->
            <div
              style="grid-column: 1 / -1; margin-top: 15px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 1.1rem;">🔒</span>
              <strong style="color: #34d399;">Aturan Pembatasan Scan & Tanpa Kartu</strong>
            </div>

            <div class="form-group">
              <label for="cfgPoinTanpaKartu">Poin Tidak Membawa ID Card</label>
              <input type="number" id="cfgPoinTanpaKartu" value="2" min="0">
            </div>
            <div class="form-group">
              <label for="cfgCooldownScan">Cegah Double Scan (Menit)</label>
              <input type="number" id="cfgCooldownScan" value="1" min="1">
            </div>

            <div class="form-group"
              style="grid-column: 1 / -1; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 8px; padding: 12px;">
              <label
                style="display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0; font-weight: 600; color: #6ee7b7;">
                <input type="checkbox" id="cfgLockOncePerDay" checked
                  style="width: 18px; height: 18px; cursor: pointer;">
                <span>Kunci 1 Hari 1x Scan (Maksimal 1x Masuk & 1x Pulang per hari)</span>
              </label>
              <small style="display: block; margin-top: 4px; color: var(--text-muted);">Mencegah siswa absen
                masuk/pulang lebih dari satu kali dalam satu hari.</small>
            </div>

            <!-- Fitur Suara / Text-to-Speech -->
            <div
              style="grid-column: 1 / -1; margin-top: 15px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 1.1rem;">🗣️</span>
                <strong style="color: #38bdf8;">Suara Panggilan Nama Siswa (Text-to-Speech)</strong>
              </div>
              <button type="button" id="btnTestVoice" class="btn-secondary-action"
                style="padding: 4px 10px; font-size: 0.78rem; border-color: #38bdf8; color: #38bdf8;">
                🔊 Tes Suara
              </button>
            </div>

            <div class="form-group"
              style="grid-column: 1 / -1; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 8px; padding: 12px;">
              <label
                style="display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0; font-weight: 600; color: #7dd3fc;">
                <input type="checkbox" id="cfgTtsEnabled" checked style="width: 18px; height: 18px; cursor: pointer;">
                <span>Sebutkan Nama Siswa dengan Suara Bahasa Indonesia</span>
              </label>
              <small style="display: block; margin-top: 4px; margin-bottom: 12px; color: var(--text-muted);">Saat siswa
                scan, aplikasi otomatis memanggil nama siswa. Gunakan kode <code>{nama}</code> untuk posisi nama
                siswa.</small>

              <div style="display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 8px;">
                <div>
                  <label for="cfgTtsTemplateMasuk"
                    style="font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 4px;">Kalimat Masuk Tepat
                    Waktu:</label>
                  <input type="text" id="cfgTtsTemplateMasuk" value="Terima kasih, {nama}!"
                    placeholder="Contoh: Terima kasih, {nama}!">
                </div>
                <div>
                  <label for="cfgTtsTemplateTerlambat"
                    style="font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 4px;">Kalimat Masuk
                    Terlambat:</label>
                  <input type="text" id="cfgTtsTemplateTerlambat" value="Perhatian, {nama}, Anda terlambat."
                    placeholder="Contoh: Perhatian {nama}, Anda terlambat.">
                </div>
                <div>
                  <label for="cfgTtsTemplatePulang"
                    style="font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 4px;">Kalimat Presensi
                    Pulang:</label>
                  <input type="text" id="cfgTtsTemplatePulang" value="Terima kasih, {nama}, selamat jalan."
                    placeholder="Contoh: Terima kasih {nama}, selamat jalan.">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab 2: Akun User & Admin (Google Sheets) -->
        <div id="stSecurity" class="tab-pane">
          <div class="settings-help-box">
            <p>👥 <strong>Tersimpan di Spreadsheet (Tab "Data_Pengguna"):</strong> Seluruh akun Petugas dan Admin
              disimpan langsung di Google Spreadsheet Anda. Data dicadangkan ke memori lokal browser agar tetap bisa
              login saat gerbang offline.</p>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <strong style="color: var(--cyan); font-size: 0.95rem;">Daftar Akun Petugas & Admin</strong>
            <button id="btnFetchUsersSpreadsheet" type="button" class="btn-secondary-action"
              style="padding: 6px 12px; font-size: 0.8rem; border-color: var(--cyan); color: var(--cyan);">🔄 Tarik dari
              Spreadsheet</button>
          </div>

          <!-- Tabel Pengguna -->
          <div
            style="max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; background: rgba(0,0,0,0.25);">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left;">
              <thead>
                <tr
                  style="background: rgba(255,255,255,0.06); color: var(--text-muted); border-bottom: 1px solid var(--border);">
                  <th style="padding: 8px 10px;">Username</th>
                  <th style="padding: 8px 10px;">Nama Lengkap</th>
                  <th style="padding: 8px 10px;">Role</th>
                  <th style="padding: 8px 10px;">Status</th>
                  <th style="padding: 8px 10px; text-align: right;">Aksi</th>
                </tr>
              </thead>
              <tbody id="userListTableBody">
                <!-- Diisi otomatis oleh JavaScript -->
              </tbody>
            </table>
          </div>

          <!-- Form Tambah / Edit User -->
          <div
            style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 14px;">
            <strong id="formUserTitle"
              style="display: block; margin-bottom: 10px; font-size: 0.9rem; color: var(--text-main);">➕ Tambah / Edit
              Akun Pengguna</strong>
            <div class="form-grid-2">
              <div class="form-group" style="margin-bottom: 8px;">
                <label for="uFormUsername">Username</label>
                <input type="text" id="uFormUsername" placeholder="Contoh: penjaga1 / admin">
              </div>
              <div class="form-group" style="margin-bottom: 8px;">
                <label for="uFormName">Nama Petugas</label>
                <input type="text" id="uFormName" placeholder="Contoh: Budi Santoso">
              </div>
              <div class="form-group" style="margin-bottom: 8px;">
                <label for="uFormPin">PIN / Password Masuk</label>
                <input type="password" id="uFormPin" placeholder="PIN minimal 4 angka / huruf">
              </div>
              <div class="form-group" style="margin-bottom: 8px;">
                <label for="uFormRole">Hak Akses (Role)</label>
                <select id="uFormRole"
                  style="width: 100%; padding: 10px; background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px;">
                  <option value="petugas">Petugas (Scan Presensi Saja)</option>
                  <option value="admin">Administrator (Bisa Buka Pengaturan)</option>
                </select>
              </div>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button id="btnSaveUserSpreadsheet" type="button" class="btn-primary-action"
                style="flex: 1; padding: 9px;">💾 Simpan Akun ke Spreadsheet</button>
              <button id="btnResetUserForm" type="button" class="btn-secondary-action"
                style="padding: 9px 14px;">Batal</button>
            </div>
          </div>
        </div>

        <!-- Tab 3: Google Sheets & E-Absensi -->
        <div id="stSheets" class="tab-pane">
          <div class="settings-help-box">
            <p>💡 <strong>Deployment Terpisah (Standalone):</strong> Web App Google Apps Script cukup di-deploy
              <strong>1 kali saja</strong> secara mandiri di <a href="https://script.google.com" target="_blank"
                style="color: var(--cyan); text-decoration: underline;">script.google.com</a>. Setelah itu, Anda
              <strong>hanya perlu memasukkan ID Spreadsheet E-Absensi</strong> (atau tempel link spreadsheet) kapan pun
              berganti file presensi!</p>
          </div>
          <div class="form-group">
            <label for="cfgSpreadsheetId">ID Spreadsheet E-Absensi Target <span
                style="color: var(--cyan); font-weight: 600;">(Wajib)</span></label>
            <input type="text" id="cfgSpreadsheetId"
              placeholder="Contoh: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms atau paste link spreadsheet">
            <small>Salin ID dari URL Google Spreadsheet Anda (antara teks <code>/d/</code> dan <code>/edit</code>) atau
              tempel link URL lengkapnya.</small>
          </div>
          <div class="form-group">
            <label for="cfgSheetName">Nama Tab Sheet Tujuan (E-Absensi)</label>
            <input type="text" id="cfgSheetName" value="catatan_poin" placeholder="catatan_poin">
            <small>Data pelanggaran dicatat ke <code>catatan_poin</code> (dan otomatis terhubung ke
              <code>absensi</code>).</small>
          </div>
          <div class="form-group">
            <label for="cfgGasUrl">URL Web App Google Apps Script Terpusat</label>
            <input type="text" id="cfgGasUrl" placeholder="https://script.google.com/macros/s/.../exec">
            <small>URL hasil Deploy Standalone Web App di script.google.com (cukup diisi sekali untuk semua file
              spreadsheet).</small>
          </div>
          <div style="display: flex; gap: 10px; margin-top: 12px;">
            <button id="btnTestGas" type="button" class="btn-secondary-action" style="flex: 1;">🧪 Test Koneksi
              E-Absensi</button>
            <button id="btnSettingsManualSync" type="button" class="btn-secondary-action"
              style="flex: 1; border-color: var(--cyan); color: var(--cyan);">🔄 Sinkronkan Antrean Sekarang</button>
          </div>
          <button id="btnSyncMasterFromSheets" type="button" class="btn-primary-action"
            style="width: 100%; margin-top: 10px; padding: 11px; font-weight: 700; background: linear-gradient(135deg, #0284c7, #0f766e);">
            📥 Tarik Data Siswa & Kategori Poin dari Spreadsheet
          </button>
          <button id="btnInitSheets" type="button" class="btn-secondary-action"
            style="width: 100%; margin-top: 10px; padding: 11px; font-weight: 700; border-color: #38bdf8; color: #38bdf8;">
            🛠️ Buat Sheet Pengaturan & Data Pengguna di Spreadsheet
          </button>
          <button id="btnCopyQuickLink" type="button" class="btn-secondary-action"
            style="width: 100%; margin-top: 10px; padding: 10px; font-weight: 600;">
            🔗 Salin Link Scanner Siap Pakai (Untuk Dibuka di Browser/HP Lain)
          </button>
        </div>

        <!-- Tab 4: Firebase -->
        <div id="stFirebase" class="tab-pane">
          <div class="form-group">
            <label for="cfgFbApiKey">Firebase API Key</label>
            <input type="text" id="cfgFbApiKey" placeholder="AIzaSy...">
          </div>
          <div class="form-group">
            <label for="cfgFbDatabaseUrl">Realtime Database URL</label>
            <input type="text" id="cfgFbDatabaseUrl" placeholder="https://projek-absensi-default-rtdb.firebaseio.com">
          </div>
          <div class="form-group">
            <label for="cfgFbProjectId">Firebase Project ID</label>
            <input type="text" id="cfgFbProjectId" placeholder="projek-absensi">
          </div>
          <button id="btnTestFirebase" class="btn-secondary-action">Test Koneksi Firebase</button>
        </div>

        <!-- Tab 5: Master Data Siswa -->
        <div id="stMaster" class="tab-pane">
          <p class="tab-desc">Simpan data siswa agar saat scan kartu, Nama dan Kelas siswa langsung otomatis muncul
            seketika di layar.</p>

          <button id="btnFetchStudentsSpreadsheet" type="button" class="btn-primary-action"
            style="width: 100%; margin-bottom: 16px; padding: 12px; font-weight: 700; background: linear-gradient(135deg, #0284c7, #0f766e);">
            📥 Tarik Data Siswa dari Spreadsheet (Otomatis)
          </button>

          <div class="form-group">
            <label>Atau Upload File CSV Siswa (Format: NISN, Nama, Kelas):</label>
            <input type="file" id="cfgCsvMasterInput" accept=".csv">
          </div>
          <div class="form-group">
            <label>Atau Tempel (Paste) Teks CSV Siswa di Sini:</label>
            <textarea id="cfgCsvMasterText" rows="4"
              placeholder="NISN,Nama,Kelas&#10;0104020357,ASEP SAEPURROHMAN,X 1&#10;0051234568,Siti Nurhaliza,XII MIPA 2"></textarea>
          </div>
          <div class="master-bar">
            <span>Siswa Tersimpan: <strong id="masterCount">0</strong> data</span>
            <button id="btnSaveMasterData" class="btn-secondary-action">Simpan Master Siswa</button>
          </div>
        </div>
      </div>

      <div class="modal-box-footer">
        <button id="btnExportCsv" class="btn-secondary-action">📥 Download CSV Hari Ini</button>
        <button id="btnSaveSettings" class="btn-primary-action">Simpan Pengaturan</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="./audio.js?v=3.0"></script>
  <script src="./storage.js?v=3.0"></script>
  <script src="./firebase-service.js?v=3.0"></script>
  <script src="./sync-service.js?v=3.0"></script>
  <script src="./scanner.js?v=3.0"></script>
  <script src="./app.js?v=3.0"></script>
</body>

</html>
